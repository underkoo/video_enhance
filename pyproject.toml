[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-enhance"
version = "0.1.0"
description = "Fail-fast real-world video frame interpolation and video super-resolution pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "underkoo", email = "underkoo@gmail.com" }]
dependencies = [
    "hydra-core==1.3.5",
    "numpy==1.26.4",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.3",
    "uv==0.12.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rvfi_sr = ["py.typed"]

[tool.pytest.ini_options]
# WSL에서 Windows TEMP(DrvFs)를 사용할 때 pytest capture의 unlinked tempfile이
# 사라지는 문제를 피합니다. 출력 캡처보다 검증 실행의 결정성을 우선합니다.
addopts = "-ra --strict-config --strict-markers --capture=no"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rvfi_sr"]
