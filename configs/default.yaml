input_dir: ${oc.env:VIDEO_ENHANCE_INPUT,'/mnt/d/Lewd/트위터r'}
output_dir: ${oc.env:VIDEO_ENHANCE_OUTPUT,'/mnt/d/Lewd/트위터r_enhanced'}
order: vfi_then_vsr

vfi:
  backend_id: practical-rife-v4.25
  temporal_multiplier: 2

vsr:
  backend_id: flashvsr-v1.1
  spatial_scale: 2
  # FlashVSR는 native 4x이므로 4x 결과를 메모리에서 2x로 축소합니다.
  post_downsample: true

runtime:
  allow_restricted_license: false
  fp16: true
  gpu_index: 0
  worker_timeout_seconds: 3600
  # 최종 영상은 Windows D 드라이브 외부로 나가지 않게 합니다.
  final_output_root: /mnt/d
